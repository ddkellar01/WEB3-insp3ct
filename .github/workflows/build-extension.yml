name: Package Browser Extension

on:
  push:
    branches: [ main ]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip Extension Files
        run: |
          mkdir -p dist
          zip -r dist/web3-insp3ct-extension.zip extension/
      - uses: actions/upload-artifact@v4
        with:
          name: web3-insp3ct-extension
          path: dist/web3-insp3ct-extension.zip
